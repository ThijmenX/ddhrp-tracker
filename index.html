<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDHRP Members</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0e15; color: #f4f6fc;
    font-family: Arial, Helvetica, sans-serif;
  }
  .tracker {
    width: min(360px, calc(100% - 32px));
    padding: 28px 24px; text-align: center;
    background: #151b29; border: 1px solid #293247; border-radius: 18px;
  }
  h1 { margin: 0 0 14px; font-size: 15px; letter-spacing: 2px; }
  .count { margin-bottom: 18px; color: #9aabf5; font-size: 42px; font-weight: 800; }
  .bar { height: 9px; overflow: hidden; border-radius: 20px; background: #30394d; }
  .fill { width: 96.2857%; height: 100%; border-radius: inherit; background: #7289da; }
  p { margin: 12px 0 0; color: #9aa5b8; font-size: 12px; }
</style>
</head>
<body>
  <main class="tracker">
    <h1>DDHRP MEMBERS</h1>
    <div class="count">674 / 700</div>
    <div class="bar"><div class="fill"></div></div>
    <p>Nog 26 leden tot de giveaway!</p>
  </main>
</body>
</html>
